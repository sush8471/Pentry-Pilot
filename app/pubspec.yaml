name: pantry_pilot
description: "Pantry Pilot: Real-Time Offline Dietary & Allergen HUD powered by Cactus Compute"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: '>=3.27.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  ffi: ^2.1.3
  flutter_riverpod: ^2.6.1
  camera: ^0.11.0+2
  sqflite: ^2.4.1
  path: ^1.9.1
  path_provider: ^2.1.5
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  test: ^1.32.0

flutter:
  uses-material-design: true
  assets:
    - assets/models/
    - assets/data/
